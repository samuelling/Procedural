<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lamina</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
:root {
  /* One dark world by choice: a microscope's black field. The tissue fills the frame, readouts sit in the top corners
     like the margins of a micrograph, controls run along the bottom. */
  --field: #03040a; --ink: #e9edf7; --dim: #8d95ab; --line: rgba(233, 237, 247, .17); --panel: rgba(7, 9, 19, .74); --hot: #ffb347;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --sans: 'IBM Plex Sans Condensed', 'Arial Narrow', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--field); color: var(--ink); font: 400 13px/1.35 var(--sans); }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#c:active { cursor: grabbing; }
#hud, #ra, #ui, #lb { position: fixed; pointer-events: none; text-shadow: 0 0 2px var(--field), 0 0 7px var(--field); }
#hud { top: 14px; left: 16px; max-width: min(330px, calc(100% - 200px)); }
h1 { margin: 0; font: 600 15px/1 var(--sans); letter-spacing: .34em; text-transform: uppercase; }
#l1 { margin: 7px 0 0; font: 500 12px/1.3 var(--mono); }
#l2 { margin: 3px 0 0; font: 400 11px/1.45 var(--mono); color: var(--dim); }
#lg { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12px; }
#lg[hidden] { display: none; }
#lg i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
#ra { top: 14px; right: 16px; width: 172px; text-align: right; }
#rs { width: 100%; height: 72px; display: block; border: 1px solid var(--line); border-right-color: var(--hot); background: rgba(3, 4, 10, .6); }
#ra p { margin: 4px 0 0; font: 400 10px/1.3 var(--mono); color: var(--dim); }
#sb { margin-top: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font: 500 11px/1 var(--mono); }
#sbi { height: 5px; border: 1px solid var(--ink); border-top: 0; }
#lb { inset: 0; }
#lb span { position: absolute; left: 0; top: 0; font: 500 11px/1 var(--mono); color: var(--dim); white-space: nowrap; }
#ui { left: 0; right: 0; bottom: 0; padding: 0 16px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
#hint { flex: 1 0 100%; margin: 0; color: var(--dim); font-size: 12px; }
#hint[hidden] { display: none; }
.row { display: flex; pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
button { font: 500 13px/1 var(--sans); color: var(--dim); background: none; border: 0; border-right: 1px solid var(--line); padding: 9px 11px; cursor: pointer; white-space: nowrap; }
button:last-child { border-right: 0; }
button:hover { color: var(--ink); }
button[aria-pressed="true"] { color: var(--field); background: var(--hot); }
button:focus-visible { outline: 2px solid var(--hot); outline-offset: -2px; }
#err { position: fixed; inset: 0; margin: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 15px; background: var(--field); }
#err[hidden] { display: none; }
@media (max-width: 560px) {
  #hud { max-width: calc(100% - 164px); }
  #ra { width: 118px; } #rs { height: 54px; }
  #l2 { font-size: 10px; }
  button { padding: 9px 9px; font-size: 12px; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lb"></div>
<header id="hud">
  <h1>Lamina</h1>
  <p id="l1"></p>
  <p id="l2"></p>
  <ul id="lg" hidden></ul>
</header>
<aside id="ra">
  <canvas id="rs" width="440" height="180"></canvas>
  <p>Spikes by depth · last 8 s</p>
  <div id="sb"><div id="sbi"></div><span id="sbt"></span></div>
</aside>
<footer id="ui">
  <p id="hint"></p>
  <div class="row" role="group" aria-label="Genome">
    <button id="g-cortex" data-g="cortex">Neocortex</button><button id="g-cerebellum" data-g="cerebellum">Cerebellum</button><button id="g-hippocampus" data-g="hippocampus">Hippocampus</button>
  </div>
  <div class="row" role="group" aria-label="Colour">
    <button id="m-0" data-m="0">Brainbow</button><button id="m-1" data-m="1">Cell type</button><button id="m-2" data-m="2">Calcium</button>
  </div>
  <div class="row" role="group" aria-label="Actions">
    <button id="b-sec" aria-pressed="false">Section</button><button id="b-stim">Stimulate</button><button id="b-seed">Reseed</button><button id="b-mut">Mutate</button><button id="b-snd" aria-pressed="false">Sound</button>
  </div>
</footer>
<p id="err" hidden></p>
<script>__JS__</script>
</body>
</html>
