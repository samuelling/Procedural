<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sylva</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
:root {
  /* One world by choice: the forest fills the frame and sets the light, so the interface stays dark and small.
     Readout top left like a specimen label, controls along the bottom. */
  --field: #0a0d0a; --ink: #f1f3ea; --dim: #b9c0ad; --line: rgba(241, 243, 234, .22); --panel: rgba(12, 16, 12, .62); --sun: #ffc457;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --sans: 'IBM Plex Sans Condensed', 'Arial Narrow', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--field); color: var(--ink); font: 400 13px/1.35 var(--sans); }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#c:active { cursor: grabbing; }
#hud, #ui { position: fixed; pointer-events: none; text-shadow: 0 0 2px #000, 0 0 8px rgba(0, 0, 0, .8); }
#hud { top: 12px; left: 12px; max-width: min(372px, calc(100% - 24px)); padding: 10px 12px 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; backdrop-filter: blur(6px); text-shadow: none; }
h1 { margin: 0; font: 600 15px/1 var(--sans); letter-spacing: .34em; text-transform: uppercase; }
#l1 { margin: 7px 0 0; font: 500 12px/1.3 var(--mono); }
#l2 { margin: 3px 0 0; font: 400 11px/1.45 var(--mono); color: var(--dim); }
#lg { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12px; }
#lg i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
#ui { left: 0; right: 0; bottom: 0; padding: 0 16px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
#hint { flex: 1 0 100%; margin: 0; color: var(--dim); font-size: 12px; }
#hint[hidden] { display: none; }
.row { display: flex; align-items: center; pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; backdrop-filter: blur(6px); text-shadow: none; }
button { font: 500 13px/1 var(--sans); color: var(--dim); background: none; border: 0; border-right: 1px solid var(--line); padding: 9px 11px; cursor: pointer; white-space: nowrap; }
button:last-child { border-right: 0; }
button:hover { color: var(--ink); }
button[aria-pressed="true"] { color: var(--field); background: var(--sun); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sun); outline-offset: -2px; }
label { padding: 0 4px 0 11px; color: var(--dim); font: 500 13px/1 var(--sans); white-space: nowrap; }
input[type=range] { width: 150px; margin: 0 11px 0 6px; height: 31px; accent-color: var(--sun); background: none; }
#err { position: fixed; inset: 0; margin: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 15px; background: var(--field); }
#err[hidden] { display: none; }
@media (max-width: 560px) {
  #l2 { font-size: 10px; }
  button { padding: 9px 9px; font-size: 12px; }
  input[type=range] { width: 110px; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header id="hud">
  <h1>Sylva</h1>
  <p id="l1"></p>
  <p id="l2"></p>
  <ul id="lg"></ul>
</header>
<footer id="ui">
  <p id="hint"></p>
  <div class="row" role="group" aria-label="Forest">
    <button id="g-mixed" data-g="mixed">Mixed</button><button id="g-boreal" data-g="boreal">Boreal</button><button id="g-oldgrowth" data-g="oldgrowth">Old growth</button><button id="g-aspen" data-g="aspen">Aspen</button>
  </div>
  <div class="row">
    <label for="day">Time of day</label><input id="day" type="range" min="20" max="980" value="300">
  </div>
  <div class="row" role="group" aria-label="Actions">
    <button id="b-far">Overview</button><button id="b-seed">Reseed</button><button id="b-mut">Mutate</button><button id="b-snd" aria-pressed="false">Sound</button>
  </div>
</footer>
<p id="err" hidden></p>
