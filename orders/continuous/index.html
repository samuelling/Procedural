<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Worlds, continuous</title>
<style>
:root { --ink: #eef0e2; --amber: #e8b25a; --lichen: #a8c99a; --glass: rgba(14, 20, 13, .62); --serif: 'Fraunces', 'Iowan Old Style', Palatino, Georgia, serif; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#hud { position: fixed; left: 14px; top: 14px; padding: 10px 14px 12px; border-radius: 12px; background: var(--glass); color: var(--ink); font: 400 13px/1.4 system-ui, sans-serif; backdrop-filter: blur(8px); min-width: 210px; pointer-events: none; }
#hud h1 { margin: 0 0 2px; font: italic 600 22px/1 var(--serif); } #phys { font-size: 11px; opacity: .7; margin-bottom: 6px; max-width: 240px; }
#scale { font: 600 20px/1.1 var(--serif); color: var(--amber); } #what { font: italic 400 15px/1.2 var(--serif); color: var(--lichen); }
#track { margin-top: 8px; height: 4px; border-radius: 2px; background: rgba(238,240,226,.15); } #bar { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--lichen), var(--amber)); width: 50%; }
#ends { display: flex; justify-content: space-between; font-size: 11px; opacity: .7; margin-top: 3px; } #alt { opacity: .75; font-size: 12px; margin-top: 4px; }
#hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: var(--glass); color: var(--ink); font: italic 400 14px/1.3 var(--serif); backdrop-filter: blur(8px); white-space: nowrap; pointer-events: none; }
#lock { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 18px; border: 0; border-radius: 999px; background: var(--glass); color: var(--ink); font: italic 400 16px/1.3 var(--serif); backdrop-filter: blur(8px); pointer-events: none; }
#lock[hidden] { display: none; }
#mode { position: fixed; right: 14px; top: 14px; padding: 6px 12px; border-radius: 999px; background: var(--glass); color: var(--lichen); font: italic 400 14px/1.2 var(--serif); backdrop-filter: blur(8px); pointer-events: none; }
#mode[data-m=fly] { color: var(--amber); }
#stick, .tb { display: none; }
@media (pointer: coarse) { #stick { display: block; position: fixed; left: 22px; bottom: 70px; width: 110px; height: 110px; border-radius: 50%; background: rgba(14,20,13,.35); border: 1px solid rgba(238,240,226,.25); touch-action: none; }
  #knob { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: rgba(238,240,226,.55); }
  .tb { display: block; position: fixed; right: 22px; width: 64px; height: 64px; border-radius: 50%; border: 1px solid rgba(238,240,226,.3); background: var(--glass); color: var(--ink); font: italic 400 14px var(--serif); touch-action: none; }
  #bjump { bottom: 70px; } #bfly { bottom: 146px; } #hint { display: none; } }
#sp { margin-top: 6px; font: italic 600 15px/1.2 var(--serif); color: var(--amber); } #met { font-size: 11px; opacity: .65; margin-top: 2px; }
#lifeb { position: fixed; right: 14px; top: 50px; padding: 6px 12px; border-radius: 999px; border: 0; background: var(--glass); color: var(--ink); font: italic 400 14px/1.2 var(--serif); backdrop-filter: blur(8px); cursor: pointer; }
#life { position: fixed; inset: 4vh 4vw; border-radius: 18px; background: rgba(10, 14, 9, .9); backdrop-filter: blur(10px); color: var(--ink); display: grid; grid-template-rows: auto 1fr auto; padding: 14px; }
#life[hidden] { display: none; } #lifeh { margin: 0; font: italic 400 17px/1.3 var(--serif); text-align: center; } #lifecv { width: 100%; height: 100%; min-height: 0; display: block; }
#lifex { justify-self: center; padding: 6px 16px; border-radius: 999px; border: 1px solid rgba(238,240,226,.3); background: none; color: var(--ink); font: italic 400 14px var(--serif); cursor: pointer; }
#time { position: fixed; right: 14px; bottom: 14px; display: flex; gap: 8px; align-items: center; padding: 6px 8px 6px 14px; border-radius: 999px; background: var(--glass); color: var(--ink); font: 400 12px/1.2 system-ui, sans-serif; backdrop-filter: blur(8px); }
#age { border: 0; border-radius: 999px; padding: 4px 8px; background: rgba(238,240,226,.12); color: var(--ink); font: 400 12px system-ui, sans-serif; }
#age option { color: #111; }
#bolt, #faster { border: 0; border-radius: 999px; padding: 4px 10px; background: rgba(238,240,226,.12); color: var(--amber); font: italic 400 12px var(--serif); cursor: pointer; }
@media (max-width: 760px) { #time { bottom: auto; top: 86px; } }
#err[hidden] { display: none; } #err { position: fixed; inset: 0; display: grid; place-items: center; color: var(--ink); font: 16px system-ui; background: #111; }
@media (max-width: 560px) { #hud { min-width: 0; } #hint { white-space: normal; width: calc(100% - 40px); text-align: center; } }
</style></head><body>

<button id="lifeb">Tree of life</button>
<div id="time"><span id="clk"></span><select id="age" title="deep time: older ( , ) younger ( . )"></select><button id="bolt" title="call down lightning where you look ( L )">⚡</button><button id="faster" title="faster ( ] ), slower ( [ ), stop ( T )"><span id="spd"></span> ⏩</button></div>

<div id="stick"><div id="knob"></div></div><button id="bjump" class="tb">Jump</button><button id="bfly" class="tb">Fly</button>
